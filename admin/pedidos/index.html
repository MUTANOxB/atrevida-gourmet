<!doctype html>
<html lang="pt-BR" data-store-slug="atrevida-gourmet">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="robots" content="noindex,nofollow" />
  <meta name="theme-color" content="#4A2B24" />
  <title>Pedidos | Atrevida Gourmet</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" /><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/assets/css/admin.css" />
</head>
<body data-admin-page="orders">
  <div class="admin-loading" id="adminLoading"><div class="admin-loading__mark">Verificando acesso…</div></div>
  <div class="admin-shell" id="adminShell" hidden>
    <header class="admin-topbar"><a class="admin-brand" href="/admin/pedidos/"><img src="/assets/img/logo-placeholder.svg" alt="" /><div><strong>Atrevida Gourmet</strong><span>Painel da loja</span></div></a><div class="admin-user"><div class="admin-user__copy"><strong id="adminEmail"></strong><small id="adminRole"></small></div><button class="icon-button" id="logoutButton" type="button" aria-label="Sair" title="Sair">↪</button></div></header>
    <nav class="admin-nav" aria-label="Administração"><a href="/admin/pedidos/" data-nav="orders"><span>🧾</span>Pedidos</a><a href="/admin/cardapio/" data-nav="products" data-manager-only><span>🍰</span>Cardápio</a><a href="/admin/categorias/" data-nav="categories" data-manager-only><span>🏷️</span>Categorias</a><a href="/admin/entregas/" data-nav="delivery" data-manager-only><span>🚚</span>Entregas</a><a href="/admin/configuracoes/" data-nav="settings" data-manager-only><span>⚙️</span>Ajustes</a></nav>
    <main class="admin-main">
      <div class="notice" id="mfaNotice" hidden>Recomendação de segurança: ative MFA na conta de owner/manager.</div>
      <div class="page-heading"><div><span class="eyebrow">OPERAÇÃO</span><h1>Pedidos</h1><p>Novos pedidos aparecem automaticamente. Confira os detalhes antes de mudar o status.</p></div><div class="page-actions"><span class="new-orders-badge" id="newOrdersBadge" role="status" aria-live="polite" hidden></span><button class="btn btn--ghost" type="button" id="soundToggle" aria-pressed="false">🔕 Som desligado</button><button class="btn btn--primary" type="button" id="refreshOrders">Atualizar</button></div></div>
      <div class="filters"><label class="search-field"><span aria-hidden="true">🔎</span><input id="orderSearch" type="search" placeholder="Buscar pedido, cliente ou telefone" /></label><label class="field"><span>Exibir</span><select id="orderWindow"><option value="active">Pedidos ativos</option><option value="all">Todos os recentes</option></select></label></div>
      <section class="kanban-wrap" aria-label="Fluxo de pedidos"><div class="kanban" id="ordersKanban" aria-live="polite"></div></section>
    </main>
  </div>
  <dialog id="orderDialog"><div class="dialog-panel"><div class="dialog-head"><h2 id="orderDialogTitle">Detalhes do pedido</h2><button class="dialog-close" type="button" data-close-dialog="orderDialog" aria-label="Fechar">×</button></div><div id="orderDetails"></div></div></dialog>
  <div class="toast" id="adminToast" role="status" aria-live="polite" hidden></div>
  <script type="module" src="/assets/js/admin.js"></script>
</body>
</html>
