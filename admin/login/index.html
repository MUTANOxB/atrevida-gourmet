<!doctype html>
<html lang="pt-BR" data-store-slug="atrevida-gourmet">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="robots" content="noindex,nofollow" />
  <meta name="theme-color" content="#4A2B24" />
  <title>Entrar | Atrevida Gourmet</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/assets/css/admin.css" />
</head>
<body class="login-page" data-admin-page="login">
  <main class="login-wrap">
    <section class="login-brand" aria-label="Atrevida Gourmet"><img src="/assets/img/logo-placeholder.svg" alt="" /><strong>Atrevida Gourmet</strong><span>Painel seguro da loja</span></section>
    <section class="login-card">
      <div><span class="eyebrow">ÁREA DA LOJA</span><h1>Que bom ter você aqui.</h1><p>Entre com sua conta individual para gerenciar pedidos e o cardápio.</p></div>
      <form id="loginForm" class="form-grid" method="post" action="/api/admin/auth/login" novalidate>
        <label class="field field--wide"><span>E-mail</span><input type="email" name="email" autocomplete="username" required maxlength="254" /></label>
        <label class="field field--wide"><span>Senha</span><span class="password-input"><input type="password" name="password" autocomplete="current-password" required minlength="8" maxlength="200" /><button type="button" id="passwordToggle" aria-label="Mostrar senha" title="Mostrar senha">👁</button></span></label>
        <p class="form-error field--wide" id="loginError" role="alert" hidden></p>
        <button class="btn btn--primary btn--full field--wide" type="submit" id="loginButton">Entrar</button>
      </form>
      <a class="login-back" href="/">← Voltar ao cardápio</a>
    </section>
  </main>
  <div class="toast" id="adminToast" role="status" aria-live="polite" hidden></div>
  <script type="module" src="/assets/js/admin.js"></script>
</body>
</html>
