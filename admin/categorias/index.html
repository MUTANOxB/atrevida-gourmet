<body data-admin-page="categories"><div class="admin-loading" id="adminLoading"><div class="admin-loading__mark">Verificando acesso…</div></div><div class="admin-shell" id="adminShell" hidden><header class="admin-topbar"><a class="admin-brand" href="/admin/pedidos/"><img src="/assets/img/logo-placeholder.svg" alt="" /><div><strong>Atrevida Gourmet</strong><span>Painel da loja</span></div></a><div class="admin-user"><div class="admin-user__copy"><strong id="adminEmail"></strong><small id="adminRole"></small></div><button class="icon-button" id="logoutButton" type="button" aria-label="Sair">↪</button></div></header><nav class="admin-nav" aria-label="Administração"><a href="/admin/pedidos/" data-nav="orders"><span>🧾</span>Pedidos</a><a href="/admin/cardapio/" data-nav="products" data-manager-only><span>🍰</span>Cardápio</a><a href="/admin/categorias/" data-nav="categories" data-manager-only><span>🏷️</span>Categorias</a><a href="/admin/entregas/" data-nav="delivery" data-manager-only><span>🚚</span>Entregas</a><a href="/admin/configuracoes/" data-nav="settings" data-manager-only><span>⚙️</span>Ajustes</a></nav><main class="admin-main"><div class="notice" id="mfaNotice" hidden>Recomendação de segurança: ative MFA na conta de owner/manager.</div><div class="page-heading"><div><span class="eyebrow">ORGANIZAÇÃO</span><h1>Categorias</h1><p>Organize a ordem em que as seções aparecem no cardápio.</p></div><div class="page-actions"><button class="btn btn--primary" type="button" id="newCategory">+ Nova categoria</button></div></div><section class="panel"><div class="panel__head"><h2>Categorias cadastradas</h2><small id="categoryCount"></small></div><div class="data-list" id="categoryList" aria-live="polite"></div></section></main></div>
